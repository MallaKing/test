name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16.x]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Install server dependencies
      run: npm install --workspace=server
    
    - name: Install client dependencies
      run: npm install --workspace=client
    
    - name: Run server tests
      run: npm run test --workspace=server
      continue-on-error: true
    
    - name: Run client tests
      run: npm run test --workspace=client
      continue-on-error: true
    
    - name: Check linting (if configured)
      run: npm run lint --workspace=server 2>/dev/null || true
      continue-on-error: true
    
    - name: Trigger AI Debug Server on Failure
      if: failure()
      run: |
        curl -X POST ${{ secrets.AI_SERVER_WEBHOOK }} \
          -H "Content-Type: application/json" \
          -d '{
            "repository": "${{ github.repository }}",
            "branch": "${{ github.ref }}",
            "commit": "${{ github.sha }}",
            "author": "${{ github.actor }}",
            "workflow_run_id": "${{ github.run_id }}",
            "failure_type": "ci_test_failure",
            "timestamp": "'$(date -u +'%Y-%m-%dT%H:%M:%SZ')'"
          }'
      continue-on-error: true
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: coverage/

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 16
      uses: actions/setup-node@v3
      with:
        node-version: '16'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install && npm install --workspace=server && npm install --workspace=client
    
    - name: Build backend
      run: npm run build --workspace=server 2>/dev/null || echo "No build script"
      continue-on-error: true
    
    - name: Build frontend
      run: npm run build --workspace=client
      continue-on-error: true
    
    - name: Alert on Build Failure
      if: failure()
      run: |
        curl -X POST ${{ secrets.AI_SERVER_WEBHOOK }} \
          -H "Content-Type: application/json" \
          -d '{
            "repository": "${{ github.repository }}",
            "branch": "${{ github.ref }}",
            "failure_type": "build_failure",
            "error_details": "Build compilation failed"
          }'
      continue-on-error: true

  security-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run security scan
      run: |
        npm install -g snyk 2>/dev/null || true
        snyk test --severity-threshold=high 2>/dev/null || true
      continue-on-error: true
    
    - name: Notify Security Issues
      if: failure()
      run: |
        curl -X POST ${{ secrets.AI_SERVER_WEBHOOK }} \
          -H "Content-Type: application/json" \
          -d '{
            "repository": "${{ github.repository }}",
            "failure_type": "security_vulnerability",
            "message": "Security scan detected issues"
          }'
      continue-on-error: true
