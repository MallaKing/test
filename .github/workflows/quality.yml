name: Code Quality Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'
    
    - name: Install dependencies
      run: npm install && npm install --workspace=server && npm install --workspace=client
    
    - name: Check code quality
      run: |
        echo "Running static analysis..."
        npm run test --workspace=server -- --coverage 2>/dev/null || true
      continue-on-error: true
    
    - name: Detect Logical Errors
      run: |
        echo "Scanning for potential logical errors..."
        grep -r "BUG:" server/src --color=always || true
      continue-on-error: true
    
    - name: Network Configuration Check
      run: |
        echo "Checking for protocol/network issues..."
        grep -r "http://" client/src --color=always | grep -v "localhost" || echo "No unsecured external calls found"
      continue-on-error: true
    
    - name: Report Quality Issues
      if: always()
      run: |
        curl -X POST ${{ secrets.AI_SERVER_WEBHOOK }} \
          -H "Content-Type: application/json" \
          -d '{
            "repository": "${{ github.repository }}",
            "branch": "${{ github.ref }}",
            "workflow": "code-quality-check",
            "timestamp": "'$(date -u +'%Y-%m-%dT%H:%M:%SZ')'",
            "logs_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }'
      continue-on-error: true
